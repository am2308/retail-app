
# Retail Store Sample App — Full CI/CD Pipeline
# Build & test on GitHub-hosted runners, deploy via Docker Compose on a
# self-hosted EC2 runner. See the session HTML doc for the full walkthrough.

name: Retail App CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── PLAN/CODE gate: lint every service's Dockerfile before anything else runs ──
  lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ui, catalog, cart, orders, checkout, assets]
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint — ${{ matrix.service }}
        continue-on-error: true
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/${{ matrix.service }}/Dockerfile
          failure-threshold: warning

  # ── BUILD/TEST: each service's own ci.sh, exactly as a dev would run it locally ──
  test:
    name: Build & Unit Test
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ui, catalog, cart, orders, checkout, assets]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        if: contains(fromJSON('["ui","cart","orders"]'), matrix.service)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        if: matrix.service == 'catalog'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Node
        if: matrix.service == 'checkout'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run ${{ matrix.service }}'s own CI script
        run: bash src/${{ matrix.service }}/scripts/ci.sh

  # ── SECURITY: dependency + secret scanning, gates the build stage ──
  security-scan:
    name: Dependency & Secret Scan
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [assets, catalog, checkout]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # - name: Set up JDK 21
      #   uses: actions/setup-java@v4
      #   with:
      #     distribution: temurin
      #     java-version: 21
      #     cache: maven

      # - name: Resolve dependencies
      #   run: mvn dependency:resolve

      - name: Trivy filesystem scan (dependency CVEs)
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: src/${{ matrix.service }}/
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}

  # ── BUILD IMAGE → SCAN IMAGE → PUSH (only after the scan gate passes) ──
  build-and-push:
    name: Build, Scan & Push Images
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ui, catalog, cart, orders, checkout, assets]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image locally (not pushed yet)
        run: |
          ./scripts/build-image.sh \
            -s ${{ matrix.service }} \
            -r ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }} \
            -t ${{ env.IMAGE_TAG }} \
            --actions-cache

      - name: Scan image with Trivy before promoting
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/retail-store-sample-${{ matrix.service }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          exit-code: 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image (only reached if the scan gate above passed)
        run: docker push ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/retail-store-sample-${{ matrix.service }}:${{ env.IMAGE_TAG }}

      - name: Also tag & push :latest (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/retail-store-sample-${{ matrix.service }}:${{ env.IMAGE_TAG }} \
            ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/retail-store-sample-${{ matrix.service }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/retail-store-sample-${{ matrix.service }}:latest

  # ── DEPLOY: only on the self-hosted EC2 runner, only from main ──
  deploy:
    name: Deploy via Docker Compose (self-hosted EC2)
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, retail-app-deploy]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Write deploy .env
        run: |
          cat <<EOF > dist/docker-compose/.env
          DOCKERHUB_NAMESPACE=${{ env.DOCKERHUB_NAMESPACE }}
          IMAGE_TAG=${{ env.IMAGE_TAG }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          EOF

      - name: Pull latest images
        working-directory: dist/docker-compose
        run: docker compose -f docker-compose.ci.yml pull

      - name: Deploy
        working-directory: dist/docker-compose
        run: docker compose -f docker-compose.ci.yml up -d --remove-orphans

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8888 > /dev/null; then
              echo "UI is up and responding"
              exit 0
            fi
            echo "Waiting for UI to become healthy... ($i/10)"
            sleep 10
          done
          echo "UI failed health check after deploy — leaving old containers as-is for investigation"
          exit 1

      - name: Clean up dangling images
        if: always()
        run: docker image prune -f
