# CI/CD deploy variant of dist/docker-compose/docker-compose.yml
#
# Difference from the original: the 6 application services now reference
# YOUR OWN images (built and pushed by the ci-cd.yml workflow) instead of
# the fixed public.ecr.aws/aws-containers/... :0.8.4 images. The dependency
# containers (databases, redis, rabbitmq) are unchanged — we don't build those.
#
# Requires a .env file (written by the deploy job) with:
#   DOCKERHUB_NAMESPACE=<your dockerhub username>
#   IMAGE_TAG=<git sha, or 'latest'>
#   MYSQL_PASSWORD=<a real password>

version: "2"
services:
  ui:
    ports:
      - 8888:8080
    environment:
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom
      - SERVER_TOMCAT_ACCESSLOG_ENABLED=true
      - ENDPOINTS_CATALOG=http://catalog:8080
      - ENDPOINTS_CARTS=http://carts:8080
      - ENDPOINTS_ORDERS=http://orders:8080
      - ENDPOINTS_CHECKOUT=http://checkout:8080
      - ENDPOINTS_ASSETS=http://assets:8080
    hostname: ui
    image: ${DOCKERHUB_NAMESPACE}/retail-store-sample-ui:${IMAGE_TAG}
    restart: always
    mem_limit: 512m
    cap_drop:
      - ALL

  catalog:
    hostname: catalog
    image: ${DOCKERHUB_NAMESPACE}/retail-store-sample-catalog:${IMAGE_TAG}
    restart: always
    environment:
      - GIN_MODE=release
      - DB_PASSWORD=${MYSQL_PASSWORD}
    mem_limit: 128m
    cap_drop:
      - ALL

  catalog-db:
    image: mariadb:10.9
    hostname: catalog-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      - MYSQL_DATABASE=sampledb
      - MYSQL_USER=catalog_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    mem_limit: 128m

  carts:
    hostname: carts
    image: ${DOCKERHUB_NAMESPACE}/retail-store-sample-cart:${IMAGE_TAG}
    restart: always
    environment:
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom
      - SERVER_TOMCAT_ACCESSLOG_ENABLED=true
      - SPRING_PROFILES_ACTIVE=dynamodb
      - CARTS_DYNAMODB_ENDPOINT=http://carts-db:8000
      - CARTS_DYNAMODB_CREATETABLE=true
      - AWS_ACCESS_KEY_ID=key
      - AWS_SECRET_ACCESS_KEY=dummy
    mem_limit: 256m
    cap_drop:
      - ALL

  carts-db:
    image: amazon/dynamodb-local:1.20.0
    hostname: carts-db
    restart: always
    mem_limit: 256m

  orders:
    hostname: orders
    image: ${DOCKERHUB_NAMESPACE}/retail-store-sample-orders:${IMAGE_TAG}
    restart: always
    environment:
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom
      - SERVER_TOMCAT_ACCESSLOG_ENABLED=true
      - RETAIL_ORDERS_MESSAGING_PROVIDER=rabbitmq
      - SPRING_DATASOURCE_URL=jdbc:postgresql://orders-db:5432/orders
      - SPRING_DATASOURCE_USERNAME=orders_user
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
    mem_limit: 512m
    cap_drop:
      - ALL

  orders-db:
    image: postgres:16.1
    hostname: orders-db
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_PASSWORD=${MYSQL_PASSWORD}
      - POSTGRES_DB=orders
      - POSTGRES_USER=orders_user
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d orders -U orders_user"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 128m

  checkout:
    image: ${DOCKERHUB_NAMESPACE}/retail-store-sample-checkout:${IMAGE_TAG}
    hostname: checkout
    restart: always
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    environment:
      - REDIS_URL=redis://checkout-redis:6379
      - ENDPOINTS_ORDERS=http://orders:8080
    mem_limit: 256m
    cap_drop:
      - ALL

  checkout-redis:
    image: redis:6-alpine
    hostname: checkout-redis
    restart: always
    mem_limit: 128m

  assets:
    hostname: assets
    environment:
      - PORT=8080
    image: ${DOCKERHUB_NAMESPACE}/retail-store-sample-assets:${IMAGE_TAG}
    restart: always
    mem_limit: 64m
    cap_drop:
      - ALL

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
